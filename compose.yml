services:
  # ---------- DESARROLLO ----------
  db-dev:
    image: postgres:18
    profiles:
      - dev
    environment:
      POSTGRES_USER: ${DEV_DB_USER}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER} -d postgres"]
      interval: 5s
      retries: 10
    networks:
      - net-dev

  odoo-dev:
    image: odoo:19
    profiles:
      - dev
    depends_on:
      db-dev:
        condition: service_healthy
    ports:
      - "8069:8069"
    command: --dev=all
    environment:
      - HOST=db-dev
      - USER=${DEV_DB_USER}
      - PASSWORD=${DEV_DB_PASSWORD}
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - odoo-web-data:/var/lib/odoo
    networks:
      - net-dev

  # ---------- PRODUCCIÓN ----------
  db-prod:
    image: postgres:18
    profiles:
      - prod
    environment:
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - prod-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER} -d postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - net-prod

  odoo-prod:
    image: odoo:19
    profiles:
      - prod
    depends_on:
      db-prod:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    command: -c /etc/odoo/odoo.prod.conf
    environment:
      - HOST=db-prod
      - USER=${PROD_DB_USER}
      - PASSWORD=${PROD_DB_PASSWORD}
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./config:/etc/odoo:ro
      - prod-web-data:/var/lib/odoo
    restart: unless-stopped
    networks:
      - net-prod

volumes:
  odoo-db-data:    # BD de desarrollo (conserva la que ya tienes)
  odoo-web-data:   # filestore/sessions de desarrollo
  prod-db-data:    # BD de producción
  prod-web-data:   # filestore/sessions de producción

networks:
  net-dev:
  net-prod: